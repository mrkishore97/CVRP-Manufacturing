[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "manufacturing-po-route-optimizer"
version = "1.0.0"
description = "Deadline-aware manufacturing pickup and delivery route optimizer"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.115.6",
    "folium==0.19.5",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "ortools==9.12.4544",
    "pandas==2.2.3",
    "pydantic==2.10.4",
    "pydantic-settings==2.7.1",
    "streamlit==1.43.2",
    "streamlit-folium==0.24.0",
    "uvicorn==0.34.0",
]

[project.optional-dependencies]
dev = [
    "mypy==1.15.0",
    "pytest==8.3.5",
    "pytest-cov==6.0.0",
    "respx==0.22.0",
    "ruff==0.9.10",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "frontend*"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["backend/tests", "frontend/tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = ["CVRP_PDP_Streamlit-master"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/**/*.py" = ["S101"]
"frontend/tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unreachable = true
pretty = true
show_error_codes = true
exclude = ["scripts/", "sample_data/"]

[tool.coverage.run]
branch = true
source = ["backend", "frontend"]

[tool.coverage.report]
show_missing = true
skip_covered = true
